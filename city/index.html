<script type="text/javascript">
  const cut = "Bonus";
  const adjustCfc = 0.42;
  const CONFIG = (() => {
    const params = new URLSearchParams(window.location.search);

    const DEFAULTS = {
      lang: "fr",
      brand: "jackpotcity",
      offerBase: "https://vnhh8.com/7t3pRf3M",
      sendTo: "AW-18141924080/XY1tCKGeuvMcEPCV38pD",
      b1: "100 TG",
      b2: "50 TG"
    };

    const LANDING_CONFIG_PARAMS = new Set([
      "lang",
      "brand",
      "b1",
      "b2",
      "send_to",
      "tg",
      "offer",
    ]);

    function getParam(name, fallback = "") {
      const value = params.get(name);
      if (value === null) return fallback;
      const trimmed = value.trim();
      return trimmed === "" ? fallback : trimmed;
    }

    function isValidTrackingTarget(value) {
      return /^AW-\d+\/[A-Za-z0-9_-]+$/.test(value);
    }

    function getTrackingTarget(fallback) {
      const validTargets = params
        .getAll("tg")
        .map((value) => value.trim())
        .filter(isValidTrackingTarget);

      // If tg was appended more than once, the newest valid value wins.
      return validTargets[validTargets.length - 1] || fallback;
    }

    function splitBonusParam(raw, fallbackLeft = "", fallbackRight = "") {
      if (!raw || !raw.trim()) {
        return {
          top: fallbackLeft,
          bottom: fallbackRight,
        };
      }

      const normalized = raw.trim().replace(/\+/g, " ");
      const parts = normalized.split(/\s+/).filter(Boolean);

      return {
        top: parts[0] ?? fallbackLeft,
        bottom: parts.slice(1).join(" ") || fallbackRight,
      };
    }

    function getBonusFallbackParts(raw) {
      const normalized = raw.trim().split(/\s+/).filter(Boolean);

      return {
        top: normalized[0] ?? "",
        bottom: normalized.slice(1).join(" "),
      };
    }

    function buildOfferUrl(baseUrl) {
      let result = baseUrl + "?&";
      result += "se_referrer=" + encodeURIComponent(document.referrer);
      result += "&default_keyword=" + encodeURIComponent(document.title);

      for (const [key, value] of params.entries()) {
        if (LANDING_CONFIG_PARAMS.has(key)) {
          continue;
        }

        result +=
          "&" + encodeURIComponent(key) + "=" + encodeURIComponent(value);
      }

      return result;
    }

    const lang = getParam("lang", DEFAULTS.lang);
    const brand = getParam("brand", DEFAULTS.brand);
    const offerBase = getParam("offer", DEFAULTS.offerBase);
    const trackingTarget = getTrackingTarget(DEFAULTS.sendTo);

    const bonus1Raw = getParam("b1", DEFAULTS.b1);
    const bonus2Raw = getParam("b2", DEFAULTS.b2);

    const defaultBonus1 = getBonusFallbackParts(DEFAULTS.b1);
    const defaultBonus2 = getBonusFallbackParts(DEFAULTS.b2);

    const bonus1 = splitBonusParam(
      bonus1Raw,
      defaultBonus1.top,
      defaultBonus1.bottom,
    );
    const bonus2 = splitBonusParam(
      bonus2Raw,
      defaultBonus2.top,
      defaultBonus2.bottom,
    );

    return {
      params,
      defaults: DEFAULTS,
      landingConfigParams: LANDING_CONFIG_PARAMS,
      lang,
      brand,
      offerBase,
      offerURI: buildOfferUrl(offerBase),
      trackingTarget,
      i18nUrl: DEFAULTS.i18nUrl,
      bonuses: {
        first: bonus1,
        second: bonus2,
      },
      assets: {
        bg: `https://alphaclick.click/brands/jackpotcity/bg.avif`,
        bgFallback: "https://alphaclick.click/brands/default/bg.avif",
        logo: `https://alphaclick.click/brands/jackpotcity/logo.svg`,
        holder: "https://alphaclick.click/wheel/steel-wheel-holder.avif",
        trigger: "https://alphaclick.click/wheel/trigger.avif",
        frame: "https://alphaclick.click/wheel/wheel-win-frame.avif",
        modalBg: "https://alphaclick.click/wheel/bg-modal.avif",
        mask: "https://alphaclick.click/wheel/wheel-mask.avif",
      },
    };
  })();

  async function loadI18n() {
    return {
      spin_button: "Tourner",
      wheel_plus_spins: "TOURS",
      wheel_retry: "Réessayer",
      wheel_empty: "Vide",
      main_title: "Tournez et gagnez !",
      attempts_label: "Vos essais :",
      popup_title: "Félicitations !",
      popup_retry_button: "Réessayer",
      popup_claim_button: "Obtenir le bonus",
      popup_win_prefix: "Vous avez gagné :",
      meta_title: "Jackpotcity | Canada",
    };
  }

  function getTextFitTargets(element) {
    const paragraphs = Array.from(element.querySelectorAll("p"));
    if (paragraphs.length) return paragraphs;

    let fitTarget = element.querySelector(":scope > .fit-text");
    if (!fitTarget) {
      const text = element.textContent.trim();
      if (!text) return [];

      fitTarget = document.createElement("span");
      fitTarget.className = "fit-text";
      fitTarget.textContent = text;
      fitTarget.style.display = "inline-block";

      element.textContent = "";
      element.appendChild(fitTarget);
    }

    return [fitTarget];
  }

  function resetFontSize(element) {
    const targets = getTextFitTargets(element);
    targets.forEach((target) => {
      target.style.fontSize = "";
      target.style.transform = "";
      target.style.transformOrigin = "";
    });
  }

  function getMeasuredTextWidth(element) {
    return element.scrollWidth || element.offsetWidth;
  }

  function adjustFontSizeToFit(element, c, options = {}) {
    const targets = getTextFitTargets(element);
    const baseWidth = element.offsetWidth;
    const desiredWidth = baseWidth * c;
    const maxRatio = options.maxRatio ?? (c < 0.5 ? 0.62 : c);
    const maxWidth = baseWidth * maxRatio;
    const minFontSize = options.minFontSize ?? 6;
    const rawMaxFontSize =
      options.maxFontSize ??
      (options.maxFontSizeRatio ? baseWidth * options.maxFontSizeRatio : 100);
    const maxFontSizeLimit = options.maxFontSizeLimit ?? rawMaxFontSize;
    const maxFontSize = Math.max(
      minFontSize,
      Math.min(rawMaxFontSize, maxFontSizeLimit),
    );
    const step = options.step ?? 0.5;

    if (!baseWidth || !desiredWidth || !maxWidth) return;

    targets.forEach((target) => {
      let fontSize = parseFloat(window.getComputedStyle(target).fontSize);
      if (!fontSize) return;

      target.style.whiteSpace = "nowrap";
      if (fontSize > maxFontSize) {
        fontSize = maxFontSize;
        target.style.fontSize = `${fontSize}px`;
      }

      while (getMeasuredTextWidth(target) < desiredWidth && fontSize < maxFontSize) {
        fontSize = Math.min(maxFontSize, fontSize + step);
        target.style.fontSize = `${fontSize}px`;
      }

      while (getMeasuredTextWidth(target) > maxWidth && fontSize > minFontSize) {
        fontSize = Math.max(minFontSize, fontSize - step);
        target.style.fontSize = `${fontSize}px`;
      }

      const measuredWidth = getMeasuredTextWidth(target);
      if (measuredWidth > maxWidth) {
        target.style.transformOrigin = "center center";
        target.style.transform = `scaleX(${maxWidth / measuredWidth})`;
      }
    });
  }

  function preloadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => reject(new Error(`Failed to load image: ${url}`));
      img.src = url;
    });
  }

  async function resolveBackgroundUrl() {
    try {
      await preloadImage(CONFIG.assets.bg);
      return CONFIG.assets.bg;
    } catch (error) {
      return CONFIG.assets.bgFallback;
    }
  }

  async function applyAssets() {
    const section = document.querySelector("section.body");
    const logo = document.querySelector(".logo img");
    const wheel = document.querySelector(".wheel");
    const start = document.querySelector(".start");
    const frameImg = document.querySelector(".frame img");

    if (section) {
      const bgUrl = await resolveBackgroundUrl();
      section.style.background = `url("${bgUrl}") no-repeat top left / cover`;
    }

    if (logo) {
      logo.src = CONFIG.assets.logo;
    }

    if (wheel) {
      wheel.style.background = `url("${CONFIG.assets.holder}") no-repeat top left / contain`;
    }

    if (start) {
      start.style.background = `url("${CONFIG.assets.trigger}") no-repeat center / contain`;
    }

    if (frameImg) {
      frameImg.src = CONFIG.assets.frame;
    }

    document.querySelectorAll(".popup-body").forEach((el) => {
      el.style.background = `url("${CONFIG.assets.modalBg}") no-repeat center / cover`;
    });

    document.documentElement.style.setProperty(
      "--wheel-mask-url",
      `url("${CONFIG.assets.mask}")`,
    );
  }

  function applyI18n(t) {
    const wheelSegs = document.querySelectorAll(".wheel-seg");
    const startBtnText = document.querySelector(".start p");
    const offerTitle = document.querySelector(".offer h1");
    const offerText = document.querySelector(".offer p");
    const firstPopupTitle = document.querySelector("#first-popup .popup-title");
    const secondPopupTitle = document.querySelector(
      "#second-popup .popup-title",
    );
    const retryBtn = document.querySelector("#secsp");
    const claimBtn = document.querySelector(
      "#d25c38c9-c12e-670a-4afb-5b9f8d6045ee",
    );

    if (startBtnText) startBtnText.textContent = t.spin_button;
    if (wheelSegs[0])
      wheelSegs[0].querySelector(".wheel-small-text").textContent =
        t.wheel_plus_spins;
    if (wheelSegs[1])
      wheelSegs[1].querySelector(".wheel-empty-text").textContent =
        t.wheel_retry;
    if (wheelSegs[3])
      wheelSegs[3].querySelector(".wheel-empty-text").textContent =
        t.wheel_empty;
    if (wheelSegs[4])
      wheelSegs[4].querySelector(".wheel-small-text").textContent =
        t.wheel_plus_spins;
    if (wheelSegs[5])
      wheelSegs[5].querySelector(".wheel-empty-text").textContent =
        t.wheel_retry;
    if (wheelSegs[7])
      wheelSegs[7].querySelector(".wheel-empty-text").textContent =
        t.wheel_empty;

    if (offerTitle) offerTitle.textContent = t.main_title;
    if (offerText) {
      offerText.innerHTML = `${t.attempts_label} <span id="counter">2</span>`;
    }

    if (firstPopupTitle) firstPopupTitle.textContent = t.popup_title;
    if (secondPopupTitle) secondPopupTitle.textContent = t.popup_title;
    if (retryBtn) retryBtn.textContent = t.popup_retry_button;
    if (claimBtn) claimBtn.textContent = t.popup_claim_button;

    document.title = t.meta_title || document.title;
  }

  function applyBonuses(t) {
    const wheelSegs = document.querySelectorAll(".wheel-seg");
    const b1 = CONFIG.bonuses.first;
    const b2 = CONFIG.bonuses.second;
    const bonus1Text = [b1.top, b1.bottom].filter(Boolean).join(" ");
    const bonus2Text = [b2.top, b2.bottom].filter(Boolean).join(" ");

    function setPopupText(selector, prefix, value) {
      const popupText = document.querySelector(selector);
      if (!popupText) return;

      const prefixNode = popupText.querySelector(".popup-text-prefix");
      const valueNode = popupText.querySelector(".popup-text-value");

      if (prefixNode) {
        prefixNode.textContent = prefix;
        prefixNode.hidden = !prefix;
      }

      if (valueNode) {
        valueNode.textContent = value;
        valueNode.hidden = !value;
      }
    }

    if (wheelSegs[2]) {
      wheelSegs[2].querySelector(".wheel-big-text").textContent = b1.top;
      wheelSegs[2].querySelector(".wheel-small-text").textContent = b1.bottom;
    }

    if (wheelSegs[6]) {
      wheelSegs[6].querySelector(".wheel-big-text").textContent = b2.top;
      wheelSegs[6].querySelector(".wheel-small-text").textContent = b2.bottom;
    }

    const cutedBonus = bonus1Text
      .replace(new RegExp(`^${cut}\\s+`, "i"), "")
      .trim();
    setPopupText(
      "#first-popup .popup-text",
      t.popup_win_prefix + " ",
      cutedBonus,
    );
    setPopupText(
      "#second-popup .popup-text",
      [t.popup_win_prefix, cutedBonus].filter(Boolean).join(" "),
      bonus2Text ? `+ ${bonus2Text}` : "",
    );
  }

  async function fitTexts() {
    await document.fonts.ready;

    const startBtn = document.querySelector(".start");
    const texts = document.querySelectorAll(".wheel-text-wrapper.adopt");
    const popupButtons = document.querySelectorAll(".popup-btn.adopt");

    if (startBtn) {
      resetFontSize(startBtn);
      adjustFontSizeToFit(startBtn, 0.7);
    }

    texts.forEach((el) => {
      resetFontSize(el);
      adjustFontSizeToFit(el, adjustCfc, {
        maxRatio: adjustCfc,
        minFontSize: 7,
        maxFontSizeRatio: 0.28,
        maxFontSizeLimit: 32,
      });
    });

    popupButtons.forEach((el) => {
      resetFontSize(el);
      adjustFontSizeToFit(el, 0.2, { maxRatio: 0.62, minFontSize: 7 });
    });
  }

  function initTracking() {
    const accountId = CONFIG.trackingTarget.split("/")[0];

    if (!accountId) {
      return;
    }

    const src =
      "https://www.googletagmanager.com/gtag/js?id=" +
      encodeURIComponent(accountId);
    const exists = Array.from(document.scripts).some(
      (script) => script.src === src,
    );
    if (!exists) {
      const script = document.createElement("script");
      script.async = true;
      script.src = src;
      (document.head || document.documentElement).appendChild(script);
    }

    window.dataLayer = window.dataLayer || [];
    window.gtag =
      window.gtag ||
      function () {
        dataLayer.push(arguments);
      };

    gtag("js", new Date());
    gtag("config", accountId);
  }

  function sendConversions() {
    if (typeof gtag !== "function") {
      return;
    }

    gtag("event", "conversion", {
      send_to: CONFIG.trackingTarget,
      transport_type: "beacon",
      event_timeout: 500,
    });
  }

  async function initPage() {
    initTracking();
    const [t] = await Promise.all([loadI18n(), applyAssets()]);
    applyI18n(t);
    applyBonuses(t);
    await fitTexts();
  }
</script>

    (function bootWheelControls() {
      const startBtn = document.querySelector(".start");
      const wheelBody = document.querySelector(".wheel-body");
      const firstPopup = document.querySelector("#first-popup");
      const secondPopup = document.querySelector("#second-popup");
      const secsp = document.querySelector("#secsp");
      let counter = document.querySelector("#counter");

      // Kartra may execute a code block before its markup is attached.
      if (!startBtn || !wheelBody || !firstPopup || !secondPopup || !secsp) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bootWheelControls, { once: true });
        } else {
          window.setTimeout(bootWheelControls, 0);
        }
        return;
      }

      const storageKey = `wheel-state:${CONFIG.lang}:${CONFIG.brand}`;
      function readSavedState() {
        try { return JSON.parse(localStorage.getItem(storageKey) || "null"); } catch (e) { return null; }
      }
      function saveFinishedState() {
        const prefixNode = secondPopup.querySelector(".popup-text-prefix");
        const valueNode = secondPopup.querySelector(".popup-text-value");
        try {
          localStorage.setItem(storageKey, JSON.stringify({
            finished: true, bonus1: CONFIG.bonuses.first, bonus2: CONFIG.bonuses.second,
            popupPrefix: prefixNode ? prefixNode.textContent : "",
            popupValue: valueNode ? valueNode.textContent : "",
          }));
        } catch (e) {}
      }
      function applySavedPopupText(state) {
        const prefixNode = secondPopup.querySelector(".popup-text-prefix");
        const valueNode = secondPopup.querySelector(".popup-text-value");
        if (prefixNode && typeof state.popupPrefix === "string") { prefixNode.textContent = state.popupPrefix; prefixNode.hidden = !state.popupPrefix; }
        if (valueNode && typeof state.popupValue === "string") { valueNode.textContent = state.popupValue; valueNode.hidden = !state.popupValue; }
      }
      function showSavedWinState() {
        const state = readSavedState();
        if (!state?.finished) return;
        wheelBody.classList.remove("animate", "first-spin");
        wheelBody.classList.add("second-spin");
        firstPopup.classList.remove("active-popup");
        secondPopup.classList.add("active-popup");
        if (counter) counter.textContent = "0";
        applySavedPopupText(state);
        fitTexts().catch(() => {});
      }

      initPage().then(() => { counter = document.querySelector("#counter"); showSavedWinState(); });
      startBtn.addEventListener("click", function () {
        if (readSavedState()?.finished) { showSavedWinState(); return; }
        startBtn.disabled = true;
        wheelBody.classList.remove("animate");
        wheelBody.classList.add("first-spin");
        if (counter) counter.textContent = "1";
        window.setTimeout(function () { firstPopup.classList.add("active-popup"); startBtn.disabled = false; }, 6000);
      });
      secsp.addEventListener("click", function (e) {
        e.preventDefault();
        firstPopup.classList.remove("active-popup");
        wheelBody.classList.add("second-spin");
        if (counter) counter.textContent = "0";
        window.setTimeout(function () { saveFinishedState(); secondPopup.classList.add("active-popup"); }, 6000);
      });
    })();
  </script>
